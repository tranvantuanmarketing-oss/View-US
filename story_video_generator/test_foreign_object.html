<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test ForeignObject</title></head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
window.testResult = { done: false, error: null, tainted: false, captureStreamWorks: false };

async function run() {
  try {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    const html = `<div style="width:720px;height:1280px;background:#9333ea;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;"><h1>HELLO WORLD</h1></div>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280">
      <foreignObject width="720" height="1280">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:720px;height:1280px;">
          ${html}
        </div>
      </foreignObject>
    </svg>`;
    
    const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });
    
    ctx.drawImage(img, 0, 0);
    
    // Check if tainted
    try {
      ctx.getImageData(0, 0, 1, 1);
      window.testResult.tainted = false;
    } catch(e) {
      window.testResult.tainted = true;
      window.testResult.taintError = e.message;
    }
    
    // Check captureStream
    try {
      const stream = canvas.captureStream(30);
      const mr = new MediaRecorder(stream);
      mr.start();
      setTimeout(() => {
        mr.stop();
        window.testResult.captureStreamWorks = true;
        window.testResult.done = true;
      }, 200);
    } catch(e) {
      window.testResult.captureStreamWorks = false;
      window.testResult.streamError = e.message;
      window.testResult.done = true;
    }
  } catch(err) {
    window.testResult.error = err.message;
    window.testResult.done = true;
  }
}
run();
</script>
</body>
</html>
