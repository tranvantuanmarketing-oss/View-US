<script type="module">

// ============================================================
// CEL-SHADING GRADIENT MAP GENERATOR
// ============================================================
function createCelGradientTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 4; canvas.height = 1;
  const ctx = canvas.getContext('2d');
  // 3-tone stepped shading
  ctx.fillStyle = '#6b7280'; ctx.fillRect(0, 0, 1, 1);
  ctx.fillStyle = '#cbd5e1'; ctx.fillRect(1, 0, 1, 1);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(2, 0, 2, 1);
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.NearestFilter;
  texture.magFilter = THREE.NearestFilter;
  return texture;
}
const celGradient = createCelGradientTexture();

// Helper for Anime Toon Material
function toonMat(color, opts = {}) {
  return new THREE.MeshToonMaterial({
    color: color,
    gradientMap: celGradient,
    ...opts
  });
}

// ============================================================
// THREE.JS SETUP
// ============================================================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 800);

// Purple-amber cosmic rim light

rimLight.position.set(-45, 30, -45);

const hemiLight = new THREE.HemisphereLight(0xffa726, 0x3f51b5, 0.35);

// ============================================================
// SKY DOME (Cosmic Sunset Gradient: #1a0933 -> #ff7e47)
// ============================================================
function createCosmicSky() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#100524');    // Deep cosmic violet
  grad.addColorStop(0.3, '#1a0933');  // Twilight purple
  grad.addColorStop(0.55, '#4a154b'); // Magenta nebula
  grad.addColorStop(0.75, '#c0392b'); // Crimson horizon
  grad.addColorStop(0.9, '#e67e22');  // Golden orange
  grad.addColorStop(1.0, '#ffaa44');  // Warm horizon light
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // Soft anime stars
  for (let i = 0; i < 280; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 280;
    const radius = Math.random() * 1.5;
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  const texture = new THREE.CanvasTexture(canvas);
  const skyGeo = new THREE.SphereGeometry(300, 32, 32);
  const skyMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}
createCosmicSky();

// ============================================================
// ISLAND BASE (Pastel Grass #58a356 + Sandstone Walkways)
// ============================================================
function createFloatingIsland() {
  const g = new THREE.Group();

  // Grass surface
  const grass = new THREE.Mesh(
    new THREE.CylinderGeometry(ISLAND_RADIUS, ISLAND_RADIUS - 1.5, 2.5, 48),
    toonMat(0x58a356)
  );
  grass.position.y = 0;
  grass.receiveShadow = true;
  g.add(grass);

  // Sand / Shore edge ring
  const sandRing = new THREE.Mesh(
    new THREE.TorusGeometry(ISLAND_RADIUS - 0.5, 1.2, 8, 48),
    toonMat(0xf0d999)
  );
  sandRing.rotation.x = Math.PI / 2;
  sandRing.position.y = 1.2;
  g.add(sandRing);

  // Floating rock underbelly
  const rock = new THREE.Mesh(
    new THREE.CylinderGeometry(ISLAND_RADIUS - 1.5, ISLAND_RADIUS * 0.35, 14, 32),
    toonMat(0x6d4c41)
  );
  rock.position.y = -8;
  g.add(rock);

  const bottomTip = new THREE.Mesh(
    new THREE.ConeGeometry(ISLAND_RADIUS * 0.35, 12, 16),
    toonMat(0x4e342e)
  );
  bottomTip.position.y = -21;
  bottomTip.rotation.x = Math.PI;
  g.add(bottomTip);

  // Stone walkways from center to 6 buildings (Sandstone #f5deb3)
  for (let a = 0; a < 8; a++) {
    const ang = (a / 8) * Math.PI * 2;
    for (let d = 9; d < BUILDING_RING + 2; d += 2.4) {
      const stone = new THREE.Mesh(
        new THREE.BoxGeometry(2.0, 0.2, 1.4),
        toonMat(0xf5deb3)
      );
      stone.position.set(Math.cos(ang) * d, 1.35, Math.sin(ang) * d);
      stone.rotation.y = -ang;
      stone.receiveShadow = true;
      g.add(stone);
    }
  }

  // Circular plaza around Kami's Lookout
  const plazaRing = new THREE.Mesh(
    new THREE.RingGeometry(8.5, 12.5, 32),
    toonMat(0xe8d5b5)
  );
  plazaRing.rotation.x = -Math.PI / 2;
  plazaRing.position.y = 1.32;
  plazaRing.receiveShadow = true;
  g.add(plazaRing);

  scene.add(g);
  return g;
}

const nimbusClouds = [];
function createNimbusCloud(dist, height, speed, scale = 1) {
  const g = new THREE.Group();
  const mat = toonMat(0xf1c40f, { emissive: 0xffb300, emissiveIntensity: 0.2 });

  // Main puffy body composed of intersecting smooth spheres
  const sphereSizes = [2.2, 2.6, 2.0, 1.8, 1.5];
  const offsets = [
    [0, 0, 0],
    [1.8, 0.2, 0.4],
    [-1.6, 0.1, -0.3],
    [2.8, -0.4, 0.8],
    [-2.8, -0.2, 0.5]
  ];
  sphereSizes.forEach((r, i) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
    s.position.set(...offsets[i]);
    s.scale.set(1.2, 0.75, 0.9);
    s.castShadow = true;
    g.add(s);
  });

  // Little swirly cloud tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(1.0, 12, 8), mat);
  tail.position.set(-3.8, -0.5, 0.8);
  g.add(tail);

  g.scale.setScalar(scale);
  const angle = Math.random() * Math.PI * 2;
  g.position.set(Math.cos(angle) * dist, height, Math.sin(angle) * dist);
  g.userData = { angle, dist, speed, height, bobOffset: Math.random() * Math.PI };
  scene.add(g);
  nimbusClouds.push(g);
  return g;
}

// RỒNG THẦN SHENRON (COILING TUBE BODY + 7 DRAGON BALLS)
// ============================================================
const dragonBalls = [];
function createShenronAndBalls() {
  const g = new THREE.Group();

  // Create smooth spiral spine curve above temple
  const points = [];
  const loops = 3.2;
  const numPoints = 80;
  for (let i = 0; i <= numPoints; i++) {
    const t = i / numPoints;
    const angle = t * Math.PI * 2 * loops;
    const r = 7.5 - t * 2.8;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    const y = 20 + t * 14;
    points.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(points);

  // Main Emerald Green Dragon Body (#235c34)
  const tubeGeo = new THREE.TubeGeometry(curve, 90, 0.95, 12, false);
  const dragonMat = toonMat(0x27ae60, { emissive: 0x1b5e20, emissiveIntensity: 0.25 });
  const dragonBody = new THREE.Mesh(tubeGeo, dragonMat);
  dragonBody.castShadow = true;
  g.add(dragonBody);

  // Yellow Belly Tube (slightly offset & scaled)
  const bellyGeo = new THREE.TubeGeometry(curve, 90, 0.55, 8, false);
  const bellyMat = toonMat(0xffd54f);
  const dragonBelly = new THREE.Mesh(bellyGeo, bellyMat);
  dragonBelly.position.y -= 0.35;
  g.add(dragonBelly);

  // Dorsal Spikes (Red fins along the back #e74c3c)
  for (let i = 5; i < numPoints - 5; i += 3) {
    const t = i / numPoints;
    const pos = curve.getPointAt(t);
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.2, 4), toonMat(0xe74c3c));
    spike.position.copy(pos);
    spike.position.y += 0.9;
    spike.rotation.y = Math.random() * Math.PI;
    g.add(spike);
  }

  // Dragon Head
  const headPos = curve.getPointAt(1.0);
  const headGroup = new THREE.Group();
  headGroup.position.copy(headPos);

  const headSnout = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.4, 3.2), dragonMat);
  headGroup.add(headSnout);

  // Glowing Crimson Eyes
  [-0.65, 0.65].forEach(x => {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.32, 12, 12),
      toonMat(0xff1744, { emissive: 0xff0000, emissiveIntensity: 1.0 })
    );
    eye.position.set(x, 0.5, 0.8);
    headGroup.add(eye);
  });

  // Antlers / Horns (Brown #8d6e63)
  [-0.8, 0.8].forEach(x => {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.3, 3.2, 6), toonMat(0x8d6e63));
    horn.position.set(x, 1.8, -0.6);
    horn.rotation.z = (x > 0 ? -0.4 : 0.4);
    horn.rotation.x = -0.5;
    headGroup.add(horn);
  });

  // Long undulating whiskers (antennas)
  [-0.85, 0.85].forEach(x => {
    const whiskerCurve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(x, -0.2, 1.5),
      new THREE.Vector3(x * 2.2, -1.0, 3.0),
      new THREE.Vector3(x * 1.5, -2.2, 4.5)
    );
    const whisker = new THREE.Mesh(new THREE.TubeGeometry(whiskerCurve, 12, 0.1, 6, false), toonMat(0x27ae60));
    headGroup.add(whisker);
  });

  g.add(headGroup);
  g.userData.headGroup = headGroup;
  scene.add(g);

  // 7 GLOWING DRAGON BALLS AROUND SHENRON
  for (let i = 0; i < 7; i++) {
    const ballGroup = new THREE.Group();
    const a = (i / 7) * Math.PI * 2;
    const r = 11.5;

    // Golden-amber translucent glass ball
    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1.2, 16, 16),
      new THREE.MeshStandardMaterial({
        color: 0xffa000,
        emissive: 0xff6f00,
        emissiveIntensity: 0.65,
        roughness: 0.1,
        metalness: 0.1,
        transparent: true,
        opacity: 0.88
      })
    );
    ballGroup.add(ballMesh);

    // Glowing point light
    const ballLight = new THREE.PointLight(0xff9800, 0.8, 14);
    ballGroup.add(ballLight);

    // Red Stars inside (1 to 7 stars)
    const starCount = i + 1;
    for (let s = 0; s < starCount; s++) {
      const sa = (s / starCount) * Math.PI * 2;
      const sr = starCount === 1 ? 0 : 0.45;
      const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xd50000 })
      );
      star.position.set(Math.cos(sa) * sr, Math.sin(sa) * sr * 0.5, 0.6);
      ballGroup.add(star);
    }

    ballGroup.position.set(Math.cos(a) * r, 24 + (i % 3) * 3, Math.sin(a) * r);
    ballGroup.userData = { angle: a, radius: r, baseY: ballGroup.position.y, speed: 0.4 + i * 0.05 };
    scene.add(ballGroup);
    dragonBalls.push(ballGroup);
  }

  return g;
}

// CANVASES & BILLBOARDS FOR BUILDINGS
// ============================================================
function drawSafeRoundedRect(ctx, x, y, width, height, radius) {
  if (typeof ctx.roundRect === 'function') {
    ctx.roundRect(x, y, width, height, radius);
  } else {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }
}

function createBillboardText(text, sub = '', bgColor = '#231a38', textColor = '#ffd54f') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');

  // Badge background
  ctx.fillStyle = bgColor;
  drawSafeRoundedRect(ctx, 8, 8, 496, 112, 16);
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#000000';
  ctx.stroke();

  // Text
  ctx.fillStyle = textColor;
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(text, 256, 58);

  if (sub) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText(sub, 256, 96);
  }

  const texture = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(7.5, 1.88, 1);
  return sprite;
}

// ============================================================
// STATE MACHINE & TRANSITIONS
// ============================================================
let bubblesVisible = true;
let currentTimePhase = 'work';

function setState(deptId, newState) {
  const char = characters[deptId];
  if (!char) return;
  char.userData.state = newState;
  const aura = char.userData.aura;
  const capsule = char.userData.capsule;

  switch (newState) {
    case STATES.WORKING:
      char.userData.targetPos = char.userData.homePos.clone();
      aura.material.opacity = 0;
      capsule.visible = false;
      break;

    case STATES.MEETING: {
      const idx = DEPTS.findIndex(d => d.id === deptId);
      const angle = (idx / 6) * Math.PI * 2;
      char.userData.targetPos = new THREE.Vector3(Math.cos(angle) * 7.5, 1.4, Math.sin(angle) * 7.5);
      aura.material.opacity = 0.4;
      capsule.visible = false;
      break;
    }

    case STATES.WAITING: {
      const idx = DEPTS.findIndex(d => d.id === deptId);
      char.userData.targetPos = new THREE.Vector3(-3.5 + idx * 1.4, 1.4, 11.5);
      capsule.visible = true;
      aura.material.opacity = 0;
      break;
    }

    case STATES.EATING:
      char.userData.targetPos = new THREE.Vector3(
        ramenPos.x + (Math.random() - 0.5) * 4.5,
        1.4,
        ramenPos.z + 2.5 + Math.random() * 2.0
      );
      aura.material.opacity = 0.85; // SUPER SAIYAN GLOW!
      capsule.visible = false;
      addLog(`[${char.userData.dept.char}] ${EATING_LINES[Math.floor(Math.random() * EATING_LINES.length)]}`);
      break;
  }
  updateBottomBar();
}

function moveChar(char, delta) {
  if (!char.userData.targetPos) return;
  const target = char.userData.targetPos;
  const pos = char.position;
  const dx = target.x - pos.x;
  const dz = target.z - pos.z;
  const dist = Math.sqrt(dx * dx + dz * dz);
  if (dist > 0.15) {
    const speed = char.userData.state === STATES.EATING ? 14 : 7;
    const step = Math.min(speed * delta, dist);
    pos.x += (dx / dist) * step;
    pos.z += (dz / dist) * step;
    char.rotation.y = Math.atan2(dx, dz);
  }
}

window.cycleTime = function() {
  const phases = ['work', 'meeting', 'eating'];
  const idx = phases.indexOf(currentTimePhase);
  currentTimePhase = phases[(idx + 1) % phases.length];
  if (currentTimePhase === 'work') {
    DEPTS.forEach(d => setState(d.id, STATES.WORKING));
    addLog('⏩ [TUA GIỜ] Chuyển ca: Đang tập trung làm việc.');
  } else if (currentTimePhase === 'meeting') {

  } else {
    DEPTS.forEach(d => setState(d.id, STATES.EATING));
    addLog('⏩ [TUA GIỜ] Chuyển ca: Cả đội nghỉ ngơi ăn mì & đậu thần!');

const activeBubbles = [];

function showMangaMeetingDialogues() {
  activeBubbles.length = 0;
  MEETING_LINES.forEach((m, i) => {
    setTimeout(() => {
      if (characters[m.dept]?.userData.state !== STATES.MEETING) return;
      const dept = DEPTS.find(d => d.id === m.dept);
      activeBubbles.push({
        deptId: m.dept,
        charTag: `${dept.char.toUpperCase()} (${dept.ai})`,
        text: m.line,
        duration: 9000,
        createdAt: Date.now()
      });
    }, i * 1800);
  });
}

function updateBubblesOverlay() {
  if (!bubblesVisible) return;
  const container = document.getElementById('bubbles-container');
  const now = Date.now();

  for (let i = activeBubbles.length - 1; i >= 0; i--) {
    if (now - activeBubbles[i].createdAt > activeBubbles[i].duration) {
      activeBubbles.splice(i, 1);
    }
  }

  let html = '';
  activeBubbles.forEach(b => {
    const char = characters[b.deptId];
    if (!char) return;
    const p = char.position.clone();
    p.y += 4.5;
    const screen = p.project(camera);
    if (screen.z > 1) return;
    const x = (screen.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-screen.y * 0.5 + 0.5) * window.innerHeight;

    html += `
      <div class="manga-bubble" style="left:${x}px;top:${y}px">
        <div class="char-tag">${b.charTag}</div>
        <div>${b.text}</div>
      </div>
    `;
  });
  container.innerHTML = html;
}

  const now = new Date();
  document.getElementById('clock').textContent =
    `⏰ ${now.toLocaleTimeString('vi-VN')} · ${now.toLocaleDateString('vi-VN', { weekday:'long', day:'numeric', month:'long' })}`;
}

// ============================================================
// ANIMATION LOOP
// ============================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // 1. Dragon Balls orbit around Shenron
  dragonBalls.forEach(db => {
    const ud = db.userData;
    ud.angle += ud.speed * delta;
    db.position.x = Math.cos(ud.angle) * ud.radius;
    db.position.z = Math.sin(ud.angle) * ud.radius;
    db.position.y = ud.baseY + Math.sin(elapsed * 2.5 + ud.angle) * 1.6;
    db.rotation.y += delta * 1.2;
  });

  // 2. Flying Nimbus clouds drift
  nimbusClouds.forEach(cl => {
    cl.userData.angle += cl.userData.speed * delta;
    cl.position.x = Math.cos(cl.userData.angle) * cl.userData.dist;
    cl.position.z = Math.sin(cl.userData.angle) * cl.userData.dist;
    cl.position.y = cl.userData.height + Math.sin(elapsed * 1.5 + cl.userData.bobOffset) * 0.8;
  });

  // 3. Characters locomotion & animations
  Object.values(characters).forEach(char => {
    moveChar(char, delta);

    char.userData.bobPhase += delta * 3.5;
    if (char.userData.state === STATES.WORKING) {
      char.position.y = 1.4 + Math.abs(Math.sin(char.userData.bobPhase)) * 0.25;
    }

    // Ki aura pulsation
    const aura = char.userData.aura;
    if (aura.material.opacity > 0) {
      aura.rotation.z += delta * 4;
      aura.scale.setScalar(1 + Math.sin(elapsed * 6) * 0.2);
    }
  });

  // 4. Camera transition smoothing
  if (cameraAnimating) {
    camProgress += delta * 1.6;
    if (camProgress >= 1) { camProgress = 1; cameraAnimating = false; }
    const t = camProgress * camProgress * (3 - 2 * camProgress);
    camera.position.lerpVectors(camStartPos, camEndPos, t);
    controls.target.lerpVectors(camStartTar, camEndTar, t);
  }

  controls.update();
  updateBubblesOverlay();
  renderer.render(scene, camera);
}

// Initial state
updateBottomBar();
updateQueueCount();
updateClock();
setInterval(updateClock, 1000);

// Demo: 3 characters waiting for approval
setTimeout(() => {
  setState('script', STATES.WAITING);
  setState('design', STATES.WAITING);
  setState('spy', STATES.WAITING);
  addLog('📬 3 phòng ban đã hoàn tất công việc, đang cầm Capsule đứng xếp hàng chờ duyệt!');
}, 1800);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
console.log('🐉 Vũ Trụ Ngọc Rồng - Cel-Shaded Anime Office đã sẵn sàng!');
</script>
